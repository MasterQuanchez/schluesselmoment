[project]
name = "schluesselmoment"
version = "0.1.0"
description = "Schlüsselmoment – Python-Werkzeuge des Starter-Kits (Skills, PII-Scan, Tests). Die App selbst liegt in frontend/ (TypeScript)."
requires-python = ">=3.11"
dependencies = []  # kein Backend (Entscheidung D3): nur Standardbibliothek für Kit-Werkzeuge

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".cursor/skills/agent-factory/sync-to-devops"]
