ions (not just force-push)\n# Rationale: Vibe-coders should use PRs via workflow rules\ngit push\n\n# Block direct database connections\n# Rationale: Should use application APIs instead\npsql, mysql, sqlcmd, mongosh\n\n# Block package publishing\nnpm publish, pip upload, cargo publish\n```\n\n#### MCP Tool Restrictions (Vibe-Coder)\n\n```json\n{\n  \"allowedMcpTools\": [\n    \"wit_get_work_item\",\n    \"wit_my_work_items\",\n    \"repo_get_pull_request_by_id\"\n  ]\n}\n```\n\n#### Required Sandboxing\n\nVibe-coders **must** work in a devcontainer sandbox environment:\n\n**Devcontainer (Podman) - Required**\n```powershell\npodman machine start\n# Open project in Cursor → \"Reopen in Container\"\n```\n\n**Setup:**\n- One-click setup via devcontainer configuration\n- Automatic dependency installation\n- Ephemeral environment — rebuild anytime to reset\n- Strong isolation from host system\n- See [devcontainer-setup.md](./devcontainer-setup.md) for full guide\n\n### Profile Comparison Matrix\n\n| Capability | Developer | Vibe-Coder |\n|------------|-----------|------------|\n| Auto-run commands | Allowlist | [Yes] Enabled (strict hooks) |\n| Sandboxing (Devcontainer) | Optional | **Required** |\n| Hook strictness | Standard | Enhanced patterns |\n| Create PRs | Yes | [No] Read-only MCP |\n| Modify work items | Yes | [No] Read-only MCP |\n| Read work items | Yes | Yes |\n| Git push | Yes (feature branches) | [No] Blocked by hooks |\n| All models | Yes | [No] Restricted |\n| Direct DB access | [Warning] Hooks protect | [No] Blocked by hooks |\n\n---\n\n## Risk Assessment\n\n### 6.1 Risk Matrix\n\n| Risk | Likelihood | Impact | Mitigation | Residual Risk |\n|------|------------|--------|------------|---------------|\n| **Credential exposure** | Medium | High | Hooks + `.cursorignore` + file permissions | Low |\n| **Destructive commands** | Medium | Critical | Hooks + approval workflow | Low |\n| **Cloud resource deletion** | Low | Critical | Azure CLI hooks + no prod access | Low |\n| **Data exfiltration** | Medium | High | Network hooks + `.cursorignore` + Privacy Mode | Low |\n| **Package publishing** | Low | High | Publish hooks (npm, twine, docker) | Low |\n| **LLM hallucination** | High | Medium | Code review + testing | Medium |\n| **Hook bypass (tool calls)** | Medium | High | User training + `.cursorignore` + code review | Medium |\n| **Prompt injection via web** | Medium | High | Disable `@Web`, use explicit URLs, hooks | Medium |\n| **Malicious MCP servers** | Low | Critical | Use Cursor Directory MCPs only, code review | Low |\n| **Decision fatigue (non-coders)** | High | Medium | Allow read-only az commands, user-level hooks | Low-Medium |\n\n### 6.2 Known Gaps & Mitigations\n\n| Gap | Description | Mitigation |\n|-----|-------------|------------|\n| **Direct tool calls bypass hooks** | Hooks only intercept Agent actions | User training, `.cursorignore`, code review, file permissions |\n| **No Azure DevOps native integration** | Relies on MCP with limited scope | Restrict MCP tools, use guided workflows |\n| **No background agents** | All execution is local | Devcontainer sandbox, file permissions |\n| **`.cursorignore` is not security boundary** | Users can manually access | File system permissions, encryption |\n| **No admin control over MCP installation** | Users can install any MCP server | Policy: Use Cursor Directory MCPs only |\n| **Prompt injection via web content** | Malicious sites can manipulate LLM | Disable `@Web`, allowlist trusted URLs |\n| **No admin control over `@Web` feature** | Users can enable web search | User training, hooks as fallback protection |\n| **Obfuscated shell commands** | `python -c \"open('.env').read()\"` bypasses regex | Prompt-based hooks (future), `.cursorignore` |\n\n---\n\n## References\n\n### Cursor Documentation\n\n- [LLM Safety and Controls](https://cursor.com/docs/enterprise/llm-safety-and-controls) — Security controls and LLM steering\n- [Deployment Patterns](https://cursor.com/docs/enterprise/deployment-patterns) — MDM deployment and policies\n- [Privacy Overview](https://www.cursor.com/privacy-overview) — Data handling and privacy modes\n- [Agent Hooks](https://cursor.com/docs/agent/hooks) — Hook implementation guide\n- [Ignore Files](https://docs.cursor.com/context/ignore-files) — `.cursorignore` configuration\n- [MCP Integration](https://docs.cursor.com/context/mcp) — Model Context Protocol setup\n\n### Internal Documentation\n\n- [cursor-hooks.md](cursor-hooks.md) — Security hook implementation details\n- [devcontainer-setup.md](./devcontainer-setup.md) — Devcontainer sandbox setup (Podman)\n- [AI-assisted development guidelines](../development/ai-assisted-software-development.md) — AI-assisted development guidelines\n- [workflow.md](../development/workflow.md) — Development workflow documentation\n- [AGENTS.md](../AGENTS.md) — Project configuration for AI agents\n\n### External Resources\n\n- [Model Context Protocol](https://modelcontextprotocol.io/introduction) — MCP specification\n- [OWASP LLM Security](https://owasp.org/www-project-top-10-for-large-language-model-applications/) — LLM security top 10\n\n---\n\n## Appendix A: Implementation Checklist\n\n### Stage 1 (Team Account)\n\n- [ ] Enable SSO authentication\n- [ ] Enforce Privacy Mode for all team members\n- [ ] Configure zero data retention with AI providers\n- [ ] Deploy shared hooks (`.cursor/hooks/`)\n- [ ] **Install hooks at user level (`~/.cursor/hooks.json` + `~/.cursor/hooks/`)** for non-coder protection across all repos\n- [ ] Deploy workflow rules (`.cursor/rules/`)\n- [ ] Configure Azure DevOps MCP with restricted tool scope\n- [ ] **MCP Policy:** Document approved MCPs from Cursor Directory only\n- [ ] **Web Search Policy:** Instruct users to keep `@Web` disabled, use `@Link` with trusted URLs\n- [ ] Create `.cursorignore` for sensitive files\n- [ ] **Verify `.cursorignore` exists in all team repos**\n- [ ] Set up sandbox environment:\n  - [ ] Configure devcontainer with Podman (required)\n- [ ] Train users on responsibilities and guidelines\n- [ ] Establish audit log review process\n- [ ] **Run hook test suite:** `bash tests/hooks/run_tests.sh` and verify all pass\n- [ ] **Non-coder onboarding:** Verify user-level hooks work by testing dangerous commands in Cursor agent mode\n\n### Stage 2 (Enterprise Account)\n\n- [ ] Upgrade to Enterprise account\n- [ ] Configure SCIM provisioning\n- [ ] Deploy MDM policies (AllowedExtensions, AllowedTeamId)\n- [ ] **Implement security profiles** (choose one approach):\n  - [ ] Option A: Create separate Cursor teams per profile (Developer team, Vibe-Coder team)\n  - [ ] Option B: Create MDM device groups with different policies\n  - [ ] Option C: Create separate repositories with different `.cursor/` configurations\n- [ ] Configure team-wide model restrictions (applies to all members)\n- [ ] Configure per-user spending limits via SCIM directory groups\n- [ ] Evaluate GitHub/GitLab migration for background agents\n- [ ] Integrate audit logs with SIEM\n- [ ] Conduct security review and penetration testing\n\n---\n\n**Last updated: April 2026**\n\n", "knowledge/specs/E001-app-template-plan": "# Implementation Plan: App Template Hello World\n\n- **Spec**: [E001-app-template](E001-app-template.md)\n- **Status**: Done\n- **Scope**: `pyproject.toml`, `src/`, `frontend/`, `tests/`, `config/`, `scripts/`, `deployment/`, `docs/`, root meta-files\n\n## Approach\n\nWork bottom-up: backend first (no UI dependency), then frontend (can test against running backend), then the design bridge and scaffolding (documentation layer on top of working code). Each feature maps to a batch of tasks that can be a single PR. The backend and frontend features are independent and could be parallelized across developers, but within each feature, tasks are sequential because later code depends on earlier scaffolding.\n\nKey design choice: keep the template minimally complex. Every file should be understandable by a developer in their first week. Prefer explicit code over abstractions — no factory patterns, no dependency injection, no middleware chains. The agent-factory skills handle development workflow; the template code itself should be boring.\n\n## Tasks\n\n### [F001-backend-api](F001-backend-api.md)\n\n- [x] T1: Clean pyproject.toml — remove LangChain/numpy/pandas, keep FastAPI + OpenAI SDK — `pyproject.toml`\n- [x] T2: Delete requirements.txt — `requirements.txt`\n- [x] T3: Scaffold backend modules — `src/main.py`, `src/api/chat.py`, `src/services/ai_service.py`, `src/models/chat.py`, placeholder `__init__.py` files\n- [x] T4: Write backend unit tests — `tests/unit/test_chat_api.py`, `tests/unit/test_chat_service.py`\n\n### [F002-frontend-chat-ui](F002-frontend-chat-ui.md)\n\n- [x] T5: Update frontend config — `frontend/package.json` (Tailwind, Vitest, remove MUI), `tsconfig.json`, `next.config.ts`, `tailwind.config.ts`, `postcss.config.mjs`, `vitest.config.ts`\n- [x] T6: Create globals.css with Dojo tokens — `frontend/src/app/globals.css`\n- [x] T7: Build simplified components — `frontend/src/components/AppShell.tsx`, `MessageCard.tsx`, `PromptBar.tsx`, `frontend/src/lib/utils.ts`\n- [x] T8: Build chat page and services — `frontend/src/app/layout.tsx`, `page.tsx`, `frontend/src/services/api.ts`, `frontend/src/constants/index.ts`\n- [x] T9: Frontend test setup and tests — `frontend/tests/setup.ts`, `frontend/tests/unit/MessageCard.test.tsx`\n\n### [F003-design-system-bridge](F003-design-system-bridge.md)\n\n- [x] T10: Create install-design-skills.sh — `scripts/install-design-skills.sh`\n\n### [F004-template-scaffolding](F004-template-scaffolding.md)\n\n- [x] T11: Create config and env files — `config/dev.json`, `config/prod.json`, `.env.example`\n- [x] T12: Create deployment placeholders — `deployment/pipelines/`, `deployment/k8s/base/`, `deployment/k8s/overlays/`\n- [x] T13: Write API specification doc — `docs/api-specification.md`\n- [x] T14: Update meta-files — `AGENTS.md`, `.gitignore`, `README.md`\n\n### Dependencies\n\n```\nT1 ──→ T3 ──→ T4       (backend: clean deps → scaffold → test)\nT2     (independent, can run with T1)\nT5 ──→ T6 ──→ T7 ──→ T8 ──→ T9   (frontend: config → tokens → components → page → tests)\nT10    (independent, needs pattern library repo available)\nT11, T12, T13  (independent of each other, can parallelize)\nT14    (runs last — needs final structure to document accurately)\n```\n\nT1-T4 and T5-T9 are independent tracks and can run in parallel.\n\n## Test Strategy\n\n| Layer | Tool | What's tested |\n|-------|------|---------------|\n| Backend unit | pytest + httpx | Chat endpoint returns correct response shape; AI service calls OpenAI SDK with right params (mocked) |\n| Frontend unit | Vitest + Testing Library | MessageCard renders user/assistant variants; PromptBar disables send when empty |\n| Integration (manual) | Developer verification | Send message in UI → see response from backend → message displayed correctly |\n| Structure | Visual inspection | Directory layout matches architecture team's reference in AGENTS.md |\n\n## Risks\n\n| Risk | Likelihood | Mitigation |\n|------|------------|------------|\n| Tailwind config token drift from pattern library | Medium | Document exact source commit in design manifest; install script supports `--update` |\n| Component prop interfaces diverge from pattern library | Low | Use same prop names/types; add comment headers referencing source |\n| Azure OpenAI SDK breaking changes | Low | Pin version in pyproject.toml; tests mock the client |\n| Teams skip install-design-skills.sh and miss design context | Medium | README prominently documents the script; AGENTS.md references it |\n", "knowledge/specs/E001-app-template": "# App Template Hello World\n\n- **Type**: Epic\n- **Status**: Done\n- **Parent**: None (top-level epic)\n- **DevOps ID**: [#423637](https://siemensgamesa.visualstudio.com/SGRE%20Digital%20Transformation/_workitems/edit/423637)\n\n## Context\n\nThe `ai-first-dis` repo needs to become a reusable seed template for all future agentic MVP projects. Today it's an empty shell with dependency files and agent-factory skills but no runnable application. Teams cloning this repo should get a working chat app out of the box — FastAPI backend talking to Azure OpenAI, Next.js frontend with the Dojo design language — so they can skip boilerplate and start building features immediately.\n\n## Requirements\n\n### In Scope\n\n- FastAPI backend with a single `/api/chat` endpoint wrapping Azure OpenAI\n- Pydantic request/response models for the chat API\n- Next.js App Router frontend with a functional chat page\n- Simplified copies of pattern library components (AppShell, MessageCard, PromptBar) using Dojo tokens\n- Tailwind CSS configured with the Dojo design token subset\n- Vitest test setup for frontend, pytest for backend\n- Environment config files (dev.json, prod.json, .env.example)\n- Deployment directory placeholders (pipelines, k8s)\n- Script to install design skills/rules from the pattern library repo\n- Updated AGENTS.md, README.md, and .gitignore\n\n### Out of Scope\n\n- Authentication / authorization (placeholder dir only)\n- Streaming responses (stretch goal, not MVP)\n- Database or persistence layer\n- CI/CD pipeline implementation (placeholder structure only)\n- Publishing `@wp/agentic-ux-toolkit` as an npm package\n- Production Azure deployment\n- Multi-model or multi-provider support\n\n## Acceptance Criteria\n\n- Given a fresh clone, when the developer runs `uv sync && uv run uvicorn src.main:app`, then the backend starts and responds to `POST /api/chat`\n- Given the backend is running, when the developer runs `cd frontend && pnpm install && pnpm dev`, then the chat UI loads at localhost:3000\n- Given both services are running, when a user types a message and presses send, then the message appears in the chat and an AI response is displayed\n- Given the repo is cloned, when a developer inspects the structure, then it matches the architecture team's reference layout from AGENTS.md\n- Given the pattern library repo exists locally, when the developer runs `scripts/install-design-skills.sh`, then Dojo design skills and rules are copied into `.cursor/`\n- Given the frontend components, when compared to the pattern library's prop interfaces, then they are API-compatible for future swap-in\n\n## Features\n\n- [F001-backend-api](F001-backend-api.md)\n- [F002-frontend-chat-ui](F002-frontend-chat-ui.md)\n- [F003-design-system-bridge](F003-design-system-bridge.md)\n- [F004-template-scaffolding](F004-template-scaffolding.md)\n\n## Decisions\n\n- 2026-04-06: **FastAPI over Django** — Lighter weight, async-native, better fit for single-endpoint API templates. Django's ORM and admin are unnecessary overhead.\n- 2026-04-06: **Azure OpenAI SDK over LangChain** — Direct SDK is simpler, has fewer dependencies, and avoids the LangChain abstraction tax for a single chat endpoint. LangChain was removed from deps.\n- 2026-04-06: **Tailwind over MUI** — Pattern library is built on Tailwind + Dojo tokens. Using MUI would create a migration burden when teams adopt the real pattern library.\n- 2026-04-06: **Copy components, don't depend on package** — The pattern library npm package isn't published yet. Simplified copies with matching prop interfaces let teams swap in the real package later with minimal changes.\n- 2026-04-06: **Vitest over Jest** — Matches the pattern library's test setup. Faster execution, native ESM support, better TypeScript integration.\n- 2026-04-07: **Lucide icons over custom Icon component** — Pattern library uses lucide-react internally. Using it directly avoids reimplementing the Icon wrapper for the template.\n- 2026-04-08: **Added chatRetry utility** — `frontend/src/lib/chatRetry.ts` added to handle transient Azure OpenAI failures with exponential backoff. Not in original scope but necessary for a reliable hello-world experience.\n", "knowledge/specs/F001-backend-api": "# Backend Chat API\n\n- **Type**: Feature\n- **Status**: Done\n- **Parent**: [E001-app-template](E001-app-template.md)\n- **DevOps ID**: [#423638](https://siemensgamesa.visualstudio.com/SGRE%20Digital%20Transformation/_workitems/edit/423638)\n\n## Context\n\nThe template needs a minimal but realistic backend that demonstrates the FastAPI + Azure OpenAI pattern teams will use in production. A single chat endpoint is enough to prove the architecture without overcomplicating the template.\n\n## Requirements\n\n### In Scope\n\n- `src/main.py` with FastAPI app, CORS middleware, and router inclusion\n- `src/api/chat.py` with `POST /api/chat` endpoint\n- `src/services/ai_service.py` wrapping `openai.AzureOpenAI` client\n- `src/models/chat.py` with Pydantic schemas: `Message`, `ChatRequest`, `ChatResponse`\n- Placeholder directories: `src/auth/`, `src/utils/`, `src/constants/`\n- Clean `pyproject.toml` with only required deps (fastapi, uvicorn, pydantic, python-dotenv, httpx, openai)\n- Unit tests for the chat endpoint and AI service\n\n### Out of Scope\n\n- Streaming responses (SSE/WebSocket)\n- Rate limiting or throttling\n- Request validation beyond Pydantic model enforcement\n- Health check endpoint\n- OpenAPI schema customization\n\n## Acceptance Criteria\n\n- Given the backend is started, when `POST /api/chat` receives `{\"messages\": [{\"role\": \"user\", \"content\": \"hello\"}]}`, then it returns `{\"message\": {\"role\": \"assistant\", \"content\": \"...\"}, \"usage\": {...}}`\n- Given Azure OpenAI credentials are missing, when the service is called, then a clear error is raised (not a silent failure)\n- Given `pytest` is run, when all backend tests execute, then they pass without requiring a live Azure OpenAI connection (mocked)\n- Given `pyproject.toml`, when dependencies are inspected, then LangChain, numpy, and pandas are absent\n\n## Decisions\n\n- 2026-04-06: **Single `chat()` method on service** — One method that accepts messages and returns a response. No abstraction for different \"modes\" until a real use case demands it.\n- 2026-04-06: **Config via env vars, not config files for secrets** — `config/dev.json` holds non-sensitive settings (model name, temperature). API keys come from `.env` only.\n", "knowledge/specs/F002-frontend-chat-ui": "# Frontend Chat UI\n\n- **Type**: Feature\n- **Status**: Done\n- **Parent**: [E001-app-template](E001-app-template.md)\n- **DevOps ID**: [#423639](https://siemensgamesa.visualstudio.com/SGRE%20Digital%20Transformation/_workitems/edit/423639)\n\n## Context\n\nTeams cloning the template need a working chat interface that demonstrates the Next.js + Tailwind + Dojo pattern. The UI should look like a real product (not a tutorial scaffold) while remaining simple enough to understand and modify in an afternoon.\n\n## Requirements\n\n### In Scope\n\n- `frontend/src/app/page.tsx` — Chat page with message state, send handler, backend API call\n- `frontend/src/app/layout.tsx` — Root layout with Weissenhof Grotesk font and globals import\n- `frontend/src/components/AppShell.tsx` — Page chrome: header, sidebar placeholder, main content area\n- `frontend/src/components/MessageCard.tsx` — Renders a single chat message (user or assistant)\n- `frontend/src/components/PromptBar.tsx` — Text input with send button, keyboard submit\n- `frontend/src/services/api.ts` — Fetch wrapper calling `POST /api/chat`\n- `frontend/src/lib/utils.ts` — `cn()` helper (clsx + tailwind-merge)\n- `frontend/src/constants/index.ts` — API base URL, app name\n- Vitest test setup and at least one component test (MessageCard)\n\n### Out of Scope\n\n- Markdown rendering in messages\n- Code syntax highlighting\n- Loading/typing indicators (animation)\n- Conversation persistence (localStorage or backend)\n- Multiple conversations / conversation management\n- Mobile-responsive layout (desktop-first per design skill)\n\n## Acceptance Criteria\n\n- Given the frontend is running, when the user loads localhost:3000, then the AppShell renders with a header and empty chat area\n- Given the chat page is loaded, when the user types a message and presses Enter, then the message appears as a user MessageCard\n- Given a message was sent, when the backend responds, then an assistant MessageCard appears below the user's message\n- Given the PromptBar, when the input is empty, then the send button is disabled\n- Given `pnpm test` is run, then MessageCard renders correctly for both user and assistant roles\n- Given the component props, when compared to the pattern library interfaces, then they are structurally compatible\n\n## Decisions\n\n- 2026-04-06: **React state over Zustand for MVP** — Simple `useState` for the message array. Zustand is in deps for teams to adopt when complexity grows, but the hello-world doesn't need it.\n- 2026-04-07: **No loading skeleton** — Keep the first version dead simple. Teams can add streaming/loading UX when they implement real features.\n- 2026-04-08: **Added chatRetry utility** — `frontend/src/lib/chatRetry.ts` with exponential backoff added to handle transient Azure OpenAI 429/5xx errors. Includes unit test. Not in original scope but required for reliable demo flow.\n", "knowledge/specs/F003-design-system-bridge": "# Design System Bridge\n\n- **Type**: Feature\n- **Status**: Done\n- **Parent**: [E001-app-template](E001-app-template.md)\n- **DevOps ID**: [#423640](https://siemensgamesa.visualstudio.com/SGRE%20Digital%20Transformation/_workitems/edit/423640)\n\n## Context\n\nThe Dojo AI pattern library is under active development in `dis-ai-pattern-library/` but isn't published as an npm package yet. The template needs to ship with Dojo-styled components today while preserving a clean migration path to the real package. This feature bridges the gap by copying a token subset and simplified components, plus providing a script to pull design skills into any project.\n\n## Requirements\n\n### In Scope\n\n- `frontend/tailwind.config.ts` with Dojo token mappings (colors, typography, spacing, radius, shadows, transitions)\n- `frontend/src/app/globals.css` with `:root` CSS custom properties matching the pattern library's theme variables\n- Weissenhof Grotesk font files in `frontend/public/fonts/`\n- `scripts/install-design-skills.sh` that copies `.cursor/skills/dojo-*`, `.cursor/skills/design-*`, and `.cursor/rules/*.mdc` from the pattern library\n- Design manifest file (`.cursor/design-manifest.json`) recording what was installed and when\n- Header comment in each copied component: `// Reference implementation matching @wp/agentic-ux-toolkit — replace with package import when available`\n\n### Out of Scope\n\n- Full token set (only tokens used by the three hello-world components)\n- Dark mode / theme switching\n- Publishing the pattern library to Azure Artifacts\n- Automated token sync (manual script is sufficient)\n- The pattern library's custom `Icon` component (use lucide-react directly)\n\n## Acceptance Criteria\n\n- Given `tailwind.config.ts`, when Dojo token classes are used (e.g., `bg-primary-10`, `text-text-regular`), then they resolve to correct CSS values\n- Given `globals.css`, when the page loads, then `--theme-current-*` CSS variables are set on `:root`\n- Given the pattern library repo at a sibling path, when `scripts/install-design-skills.sh` runs, then dojo skills and rules are copied to `.cursor/`\n- Given the script was run, when `--list` is passed, then installed skills are displayed\n- Given the script ran previously, when `--update` is passed, then skills are refreshed from source\n- Given the install script, when it runs, then it does NOT touch `.cursor/skills/agent-factory/`\n\n## Decisions\n\n- 2026-04-06: **Token subset, not full copy** — Only include tokens the hello-world components actually use. Keeps the template's Tailwind config readable and avoids implying completeness.\n- 2026-04-06: **Bash script over npm postinstall** — The install script is a one-time or occasional operation, not a build step. A bash script is transparent and doesn't couple design skills to the Node dependency lifecycle.\n- 2026-04-07: **Manifest file for traceability** — `.cursor/design-manifest.json` records source path, timestamp, and installed skill list so teams know what they have and when it was last updated.\n- 2026-04-08: **Font files not bundled** — Weissenhof Grotesk loaded via CSS `@font-face` in `globals.css` rather than committed to `frontend/public/fonts/`. Avoids bloating the repo with binary font files; teams can add local fonts when needed.\n", "knowledge/specs/F004-template-scaffolding": "# Template Scaffolding\n\n- **Type**: Feature\n- **Status**: Done\n- **Parent**: [E001-app-template](E001-app-template.md)\n- **DevOps ID**: [#423641](https://siemensgamesa.visualstudio.com/SGRE%20Digital%20Transformation/_workitems/edit/423641)\n\n## Context\n\nBeyond the running application, the template must ship with the full project structure, configuration, and documentation that teams expect. This includes environment configs, deployment placeholders, API docs, and updated meta-files (AGENTS.md, README, .gitignore) so the repo is immediately navigable and clone-ready.\n\n## Requirements\n\n### In Scope\n\n- `config/dev.json` and `config/prod.json` with environment-specific settings (API base URL, model name, temperature)\n- `.env.example` documenting all required environment variables\n- `docs/api-specification.md` for the `/api/chat` endpoint\n- `deployment/pipelines/` and `deployment/k8s/base/`, `deployment/k8s/overlays/` placeholder directories\n- Updated `AGENTS.md` reflecting actual project structure and commands\n- Updated `README.md` with quick start, dev commands, project structure, AI workflow, and template usage guide\n- Updated `.gitignore` adding `node_modules/`, `.next/`, `dist/`, `frontend/.next/`\n- Removal of stale `requirements.txt`\n\n### Out of Scope\n\n- Actual CI/CD pipeline YAML\n- Kubernetes manifests (placeholder dirs only)\n- Terraform or infrastructure-as-code\n- Contributing guidelines beyond branch naming and PR basics\n- Changelog or release notes\n\n## Acceptance Criteria\n\n- Given a fresh clone, when a developer reads `README.md`, then they can start both backend and frontend within 5 minutes\n- Given `.env.example`, when copied to `.env` and filled in, then the backend starts without config errors\n- Given `config/dev.json`, when the backend loads it, then model name and temperature are configured\n- Given the deployment directory, when inspected, then the k8s structure matches the architecture team's convention\n- Given `AGENTS.md`, when read by a Cursor agent, then it accurately describes available commands and project layout\n- Given `.gitignore`, when `git status` is run after `pnpm install`, then `node_modules/` and `.next/` are excluded\n\n## Decisions\n\n- 2026-04-06: **Placeholder deployment dirs over empty** — Having the directory structure (even empty) signals the expected convention and prevents teams from inventing their own layout.\n- 2026-04-06: **README as template guide** — The README serves double duty: project docs for developers AND a guide for how to use this repo as a template. Keeps everything in one place.\n", "knowledge/specs/specs-overview": "# Specs Index\n\nThis directory contains the project's specification knowledge graph.\nEach spec is a standalone markdown file linked with relative markdown links.\n\n## Conventions\n\n- **Naming**: `E001-{epic-name}.md` for epics, `F001-{feature-name}.md` for features\n- **Links**: Use relative markdown links, e.g. `[E001-epic-name](E001-epic-name.md)`\n- **Template**: Follow `.cursor/skills/agent-factory/templates/spec.md`\n- **Sync**: Use the `sync-to-devops` skill to push specs to Azure DevOps\n\n## Epics\n\n- [E001-app-template](E001-app-template.md) — Seed template with FastAPI + Next.js + Dojo chat app\n  - Plan: [E001-app-template-plan](E001-app-template-plan.md)\n\n## Features\n\n- [F001-backend-api](F001-backend-api.md) — FastAPI chat endpoint wrapping Azure OpenAI\n- [F002-frontend-chat-ui](F002-frontend-chat-ui.md) — Next.js chat page with Dojo-styled components\n- [F003-design-system-bridge](F003-design-system-bridge.md) — Tailwind tokens, copied components, design skills install script\n- [F004-template-scaffolding](F004-template-scaffolding.md) — Config, deployment placeholders, docs, meta-files\n- F005-sustainability-skill (not present in this repo) — Cost + quality discipline skill, model-routing rule, and local usage dashboard\n", "knowledge/strategy/product-development-future": "# The Future of Product Development in 2026\n\n## Executive Summary\n\nSoftware development is undergoing a fundamental transformation. The \"middle\" of development—the time-intensive work of translating requirements into code—is rapidly shrinking as AI agents take over implementation. This shift repositions Product Development departments to focus on **intent formation** at the start and **quality validation** at the end, with AI-orchestrated execution in between.\n\nFor large corporate organizations, this means:\n- **10x software output** with the same team size\n- Product Management and Design become the primary bottleneck (positively)\n- Code review and UAT testing become new capacity constraints\n- AI-native applications introduce non-deterministic outputs requiring new QA approaches\n- Developer roles evolve from \"coders\" to \"orchestrators\" of agent teams\n\n---\n\n## The Disappearing Middle\n\n### Traditional Software Development (2020-2023)\n\n```mermaid\nflowchart LR\n    A[Intent<br/>10%] --> B[Implementation<br/>80%] --> C[Validation<br/>10%]\n    style B fill:#e74c3c\n```\n\n**Characteristics:**\n- Most effort spent in IDE writing, debugging, refactoring code\n- Weeks or months from specification to working software\n- Developer productivity measured in lines of code or features shipped\n- Limited by typing speed and individual cognitive capacity\n\n### AI-Augmented Development (2024-2025)\n\n```mermaid\nflowchart LR\n    A[Intent<br/>20%] --> B[Implementation<br/>60%] --> C[Validation<br/>20%]\n    style B fill:#e67e22\n```\n\n**Characteristics:**\n- AI copilots assist with code completion and suggestions\n- Developers still write most code but faster\n- Development cycles reduced by 30-50%\n- IDE remains primary workspace\n\n### AI-Orchestrated Development (2026+)\n\n```mermaid\nflowchart LR\n    A[Intent Formation<br/>40%] --> B[AI Execution<br/>20%] --> C[Quality Validation<br/>40%]\n    style A fill:#3498db\n    style C fill:#2ecc71\n```\n\n**Characteristics:**\n- AI agents generate working code from goals, context, and constraints\n- Developers orchestrate multi-agent workflows (sync + async)\n- Development cycles measured in minutes/hours, not weeks\n- IDE becomes a \"code viewer\" for review and validation\n- **The middle has collapsed**\n\n---\n\n## The New Software Development Equation\n\n![The New Software Development Equation](images/new_software_equation.png)\n\n### What Matters More\n\n#### 1. Intent Formation (Product & Design)\n\n**The Critical Question:** *What actually needs to be built?*\n\nThis becomes the primary value-add activity:\n- Understanding customer problems through interviews, feedback analysis\n- Shaping work so agents can act on it effectively\n- Defining constraints, tradeoffs, and acceptance criteria\n- Creating context-rich specifications that reduce ambiguity\n\n**Key Activities:**\n- Customer research and feedback triage\n- Problem framing and opportunity sizing\n- Writing clear, structured requirements\n- Defining success metrics and acceptance criteria\n- Creating design artifacts (wireframes, prototypes, user flows)\n\n**Why It Matters:**\n- Agents operate directly on this input\n- Poor intent = wasted agent cycles producing wrong solutions\n- Clarity here determines execution quality\n\n#### 2. Quality Validation (Review & Testing)\n\n**The Critical Question:** *Does the output actually meet the intent?*\n\nAs agents produce more code with less supervision:\n- Code review becomes a **capacity bottleneck**\n- UAT testing must scale to match 10x output\n- Non-deterministic AI-native apps require new testing approaches\n\n**Key Activities:**\n- Architectural review (is the design sound?)\n- Security review (are vulnerabilities introduced?)\n- Functional testing (does it work as specified?)\n- UAT with real users (does it solve the actual problem?)\n- Performance and reliability validation\n\n**Why It Matters:**\n- High-volume output amplifies the cost of defects\n- Trust in AI-generated code must be earned through validation\n- Quality gates prevent technical debt accumulation\n\n### What Matters Less\n\n- **Typing speed** — agents generate code orders of magnitude faster\n- **Deep IDE mastery** — less time spent in the editor\n- **Syntax memorization** — agents handle implementation details\n- **Manual debugging** — agents can fix issues autonomously\n\n---\n\n## Multi-Agent Orchestration: The New Development Model\n\n### Agent Team Architecture\n\nModern product development departments will orchestrate **teams of specialized agents**:\n\n```mermaid\nflowchart TB\n    subgraph SYNC [\"🔄 Synchronous Agents (Local)\"]\n        PM[Product Manager Agent<br/>Refines requirements]\n        ARCH[Architect Agent<br/>Designs system]\n        IMPL[Implementation Agent<br/>Writes code + tests]\n        REV[Reviewer Agent<br/>Reviews code quality]\n    end\n    \n    subgraph ASYNC [\"☁️ Asynchronous Agents (Cloud)\"]\n        TEST[Testing Agent<br/>Runs exhaustive tests]\n        SEC[Security Agent<br/>Scans vulnerabilities]\n        PERF[Performance Agent<br/>Load testing]\n        DOC[Documentation Agent<br/>Generates docs]\n    end\n    \n    HUMAN[👤 Human Orchestrator<br/>Senior Engineer] --> PM\n    PM --> ARCH --> IMPL --> REV\n    REV --> SYNC_OUT[Local Output]\n    \n    SYNC_OUT --> TEST\n    SYNC_OUT --> SEC\n    SYNC_OUT --> PERF\n    SYNC_OUT --> DOC\n    \n    TEST --> ASYNC_OUT[Cloud Results]\n    SEC --> ASYNC_OUT\n    PERF --> ASYNC_OUT\n    DOC --> ASYNC_OUT\n    \n    ASYNC_OUT --> HUMAN\n```\n\n### Synchronous Agents (Interactive)\n\n**Characteristics:**\n- Run locally during development session\n- Immediate feedback loop with human\n- Handle critical path decisions\n- Require human approval at key checkpoints\n\n**Examples:**\n- `@epic-planner` — Interviews PM, creates specifications\n- `@planner` — Analyzes features, proposes implementation plan\n- `@implement` — Generates code, writes tests, creates PR\n- `@reviewer` — Reviews code, suggests improvements\n\n**Typical Session (20-60 minutes):**\n```\n1. Human: @epic-planner create user dashboard\n2. Agent: [asks 5 rounds of clarifying questions]\n3. Human: [answers, providing context]\n4. Agent: [generates spec document]\n5. Human: [approves spec]\n6. Agent: [creates Epic + Features in Azure DevOps]\n7. Human: @implement Feature #12345\n8. Agent: [generates code, tests, creates PR]\n9. Human: [reviews, approves]\n```\n\n### Asynchronous Agents (Background)\n\n**Characteristics:**\n- Run in cloud infrastructure 24/7\n- Long-running or resource-intensive tasks\n- No real-time human interaction required\n- Report results via notifications/dashboards\n\n**Examples:**\n- Exhaustive test suite execution (1000s of test cases)\n- Security vulnerability scanning across codebase\n- Performance benchmarking under various loads\n- Documentation generation from code + comments\n- Migration of legacy code to modern frameworks\n- Technical debt analysis and refactoring suggestions\n\n**Typical Workflow:**\n```\n1. PR created by sync agent → triggers async agents\n2. Testing Agent: Runs full regression suite (2 hours)\n3. Security Agent: Scans for vulnerabilities (30 mins)\n4. Performance Agent: Executes load tests (1 hour)\n5. Documentation Agent: Updates API docs (15 mins)\n6. Results posted to PR → Human reviews summary\n```\n\n### Orchestration Challenges\n\n**1. Context Propagation**\n- How do agents share context across sync/async boundaries?\n- Solution: Structured work items (Azure DevOps) + rich descriptions\n\n**2. Coordination**\n- How do multiple agents avoid conflicts?\n- Solution: Clear ownership (one agent per file/module at a time)\n\n**3. Error Handling**\n- What happens when an agent fails or produces incorrect output?\n- Solution: Human checkpoints before external resource creation\n\n**4. Cost Management**\n- Cloud agents consume compute resources 24/7\n- Solution: Priority queues, budget limits, selective triggering\n\n---\n\n## The New Bottlenecks\n\nAs AI removes the coding bottleneck, new constraints emerge:\n\n### 1. Product Management & Design (Intentional Bottleneck)\n\n**Why it's a bottleneck:**\n- Human creativity and judgment cannot be automated\n- Customer empathy requires real conversations\n- Strategic tradeoffs need business context\n\n**Impact:**\n- PM/Design ratio increases (1 PM per 15 engineers → 1 PM per 30 agents)\n- More time spent on research, less on writing specs\n- Design becomes continuous discovery, not waterfall\n\n**How to scale:**\n- ✅ Hire more PMs and designers (positive investment)\n- ✅ Use AI to synthesize customer feedback at scale\n- ✅ Create feedback loops directly from customers to PMs\n- ✅ Invest in user research infrastructure\n\n### 2. Code Review (Capacity Constraint)\n\n**Why it's a bottleneck:**\n- 10x code output requires 10x review capacity\n- AI-generated code still needs human validation\n- Architectural decisions require senior judgment\n\n**Impact:**\n- Senior engineers spend 60-80% time reviewing, not coding\n- Review queues become longest wait time in SDLC\n- Need for specialized \"AI Code Reviewers\"\n\n**How to scale:**\n- ⚠️ AI-assisted review (agents summarize changes, flag risks)\n- ⚠️ Tiered review (critical vs. routine changes)\n- ⚠️ Automated quality gates (linting, security scans before human review)\n- ⚠️ Increase senior engineer headcount\n- ⚠️ Upskill mid-level engineers in architectural review\n\n### 3. UAT Testing (Capacity Constraint)\n\n**Why it's a bottleneck:**\n- Human judgment needed for UX quality\n- AI-native apps produce non-deterministic outputs\n- Automated tests can't catch all edge cases\n\n**Impact:**\n- QA teams overwhelmed with 10x feature output\n- Longer time-to-production despite faster development\n- Risk of quality degradation if rushed\n\n**How to scale:**\n- ⚠️ Shift-left testing (more unit tests, fewer manual tests)\n- ⚠️ AI-powered test case generation\n- ⚠️ Crowdsourced testing platforms\n- ⚠️ Increase QA headcount\n- ⚠️ Beta programs with real users for AI features\n\n---\n\n## AI-Native Applications: New Quality Challenges\n\n### Deterministic vs. Non-Deterministic Software\n\n**Traditional Software (Deterministic):**\n```python\ndef calculate_tax(income: float) -> float:\n    return income * 0.20  # Always same output for same input\n```\n✅ Easy to test: assert `calculate_tax(1000) == 200`\n\n**AI-Native Software (Non-Deterministic):**\n```python\ndef generate_report_summary(data: DataFrame) -> str:\n    # LLM generates summary — varies each time\n    return llm.complete(prompt=f\"Summarize: {data}\")\n```\n❌ Hard to test: output varies, how to validate quality?\n\n### Testing AI-Native Features\n\n**New QA Approaches Required:**\n\n1. **Semantic Testing** — Verify meaning, not exact output\n   ```python\n   summary = generate_report_summary(data)\n   assert \"revenue increased\" in summary.lower()\n   assert len(summary.split()) < 200  # brevity check\n   ```\n\n2. **LLM-as-Judge** — Use AI to evaluate AI output\n   ```python\n   evaluator_llm.score(\n       question=\"Is this summary accurate and concise?\",\n       context=data,\n       output=summary\n   )\n   assert score > 0.8\n   ```\n\n3. **Human Evaluation** — Sample-based review by experts\n   - Review 10% of AI outputs manually\n   - Flag patterns in poor outputs\n   - Retrain or adjust prompts\n\n4. **Regression Datasets** — \"Golden\" examples\n   - Curate set of exemplar inputs/outputs\n   - Test new model versions against golden set\n   - Measure quality degradation over time\n\n**Implications:**\n- QA teams need ML/AI expertise\n- Testing takes longer (more subjective)\n- Versioning and rollback become critical\n- A/B testing becomes standard practice\n\n---\n\n## Organizational Transformation\n\n### New Roles & Responsibilities\n\n#### 1. AI Orchestrator (formerly Senior Engineer)\n\n**Responsibilities:**\n- Direct teams of sync + async agents\n- Define task breakdowns for agent execution\n- Review and validate agent outputs\n- Handle escalations when agents fail\n- Optimize agent workflows for efficiency\n\n**Skills:**\n- Prompt engineering (clear, structured instructions)\n- Multi-agent coordination\n- Architectural thinking (less hands-on coding)\n- System design and tradeoff analysis\n- Code review at scale\n\n**Daily Work:**\n```\n8:00  — Review overnight async agent results\n9:00  — @epic-planner session with PM (new feature)\n10:30 — @implement 3 user stories (agent generates code)\n11:00 — Review 5 PRs from agents\n14:00 — @debugger session (agent found regression)\n15:00 — Architecture review with team\n16:00 — Optimize agent prompts based on learnings\n```\n\n#### 2. Product Manager (Intent Specialist)\n\n**Responsibilities:**\n- Primary requirements gathering and synthesis\n- Customer research and feedback triage\n- Define acceptance criteria with precision\n- Provide context for agent execution\n- Validate that outputs solve real problems\n\n**Skills:**\n- Deep customer empathy\n- Structured writing (specs, user stories)\n- Tradeoff analysis\n- Metrics definition\n- Stakeholder communication\n\n**Daily Work:**\n```\n8:00  — Analyze customer feedback (AI-synthesized insights)\n9:00  — @epic-planner session with AI Orchestrator\n11:00 — Refine user stories with acceptance criteria\n14:00 — UAT session with real users\n15:30 — Prioritization meeting with leadership\n16:30 — Review analytics dashboards\n```\n\n#### 3. QA Engineer (Validation Specialist)\n\n**Responsibilities:**\n- Design test strategies for AI-native features\n- Execute UAT for non-deterministic outputs\n- Build automated test suites (with agent help)\n- Evaluate semantic correctness of AI outputs\n- Regression testing at scale\n\n**Skills:**\n- AI/ML testing methodologies\n- LLM-as-judge evaluation frameworks\n- Exploratory testing\n- Test automation (with AI assistance)\n- Quality metrics definition\n\n**Daily Work:**\n```\n8:00  — Review test results from async testing agents\n9:00  — Design test cases for new AI feature\n10:30 — Execute UAT with sample users\n13:00 — Validate 20 PRs (AI-assisted review)\n15:00 — Analyze quality trends across sprints\n16:00 — Update regression test datasets\n```\n\n#### 4. Designer (Experience Architect)\n\n**Responsibilities:**\n- Design user experiences for AI-native features\n- Create prototypes and wireframes\n- Define interaction patterns\n- Validate UX with real users\n- Ensure consistency across AI-generated UIs\n\n**Skills:**\n- UX research and validation\n- Prototyping (Figma, etc.)\n- Design systems thinking\n- Accessibility expertise\n- Collaboration with AI tools\n\n**Daily Work:**\n```\n8:00  — User research synthesis (AI-assisted)\n9:30  — Design review with PM\n11:00 — Create wireframes for new feature\n14:00 — Usability testing session\n15:30 — Update design system components\n16:30 — Review AI-generated UI code for consistency\n```\n\n---\n\n## Coordination Layer: The Critical Infrastructure\n\n### Why Structure Matters for AI Agents\n\nFrom the research and Linear's perspective:\n\n> \"Structure in tools works for humans and agents the same way: it reduces the ambiguity of what is expected or what capabilities exist.\"\n\n**Key Requirements:**\n1. **Context-Rich Work Items** — Azure DevOps with detailed descriptions\n2. **Structured Workflows** — Clear stages, checkpoints, ownership\n3. **Traceability** — Link from customer feedback → Epic → Feature → User Story → PR → Deployment\n4. **Intent Capture** — Why decisions were made, what constraints apply\n\n### Azure DevOps as Coordination Layer\n\n```mermaid\nflowchart TB\n    subgraph INTENT [\"📋 Intent Layer\"]\n        FEEDBACK[Customer Feedback] --> EPIC[Epic]\n        EPIC --> FEATURE[Features]\n        FEATURE --> STORY[User Stories]\n    end\n    \n    subgraph EXECUTION [\"⚙️ Execution Layer\"]\n        STORY --> BRANCH[Git Branch]\n        BRANCH --> CODE[Code + Tests]\n        CODE --> PR[Pull Request]\n    end\n    \n    subgraph VALIDATION [\"✅ Validation Layer\"]\n        PR --> REVIEW[Code Review]\n        REVIEW --> CI[CI/CD Pipeline]\n        CI --> UAT[UAT Testing]\n        UAT --> PROD[Production]\n    end\n    \n    PROD --> METRICS[Analytics]\n    METRICS --> FEEDBACK\n```\n\n**Benefits for AI Agents:**\n- Clear starting point (work item with full context)\n- Expected outcomes defined (acceptance criteria)\n- Structured artifacts (PRs, test results)\n- Feedback loops (bugs, analytics back to work items)\n\n---\n\n## Conclusion: The New Craft\n\nAs the \"middle\" of software development disappears, **the craft evolves**:\n\n- **From typing code** → **to shaping intent**\n- **From debugging** → **to validating outcomes**\n- **From solo coding** → **to orchestrating agent teams**\n- **From implementation details** → **to architectural thinking**\n\n### The Winners in 2026\n\nOrganizations that will thrive:\n1. ✅ **Invest in Product & Design** — Build strong intent formation\n2. ✅ **Embrace AI Orchestration** — Adopt multi-agent workflows\n3. ✅ **Scale Review & QA** — Address the new bottlenecks\n4. ✅ **Structure Everything** — Create context-rich work items\n5. ✅ **Measure Outcomes, Not Activity** — Focus on business value\n\n### The Losers in 2026\n\nOrganizations that will struggle:\n1. ❌ **Cling to Manual Coding** — Refuse to adopt AI workflows\n2. ❌ **Underinvest in PMs** — Weak intent = wasted agent cycles\n3. ❌ **Skip Code Review** — Ship AI-generated code without validation\n4. ❌ **Ignore Non-Deterministic QA** — Fail to test AI-native features\n5. ❌ **Treat Agents as Tools** — Miss the orchestration opportunity\n\n### The Question for Leadership\n\n> \"When the middle disappears, what becomes more in focus is the work of forming the right intent and making sure the outcome actually meets it.\"\n\n**The strategic imperative:** Build organizational muscle in intent formation (Product & Design) and outcome validation (Review & QA), while enabling engineers to orchestrate AI agents at scale.\n\nThe companies that figure this out will deliver **10x more software** with the **same headcount**. The companies that don't will be left behind.\n\n---\n\n*Document Version: 1.0*\n*Last Updated: January 2026*\n*Audience: Product Development Leadership, Engineering Managers, CTOs*\n\n", "memory/council/agent-factory-architecture": "# Council Transcript: Agent Factory Architecture\n\n**Date:** 2026-04-08\n**Question:** Is the skills-based agent-factory architecture the right approach for this team's digital transformation work?\n\n---\n\n## Anonymization Mapping\n\n| Anonymous ID | Advisor Role |\n|---|---|\n| A | Expansionist |\n| B | Contrarian |\n| C | Executor |\n| D | Outsider |\n| E | First Principles |\n\n---\n\n## Step 1: Framed Question\n\nIs the skills-based agent-factory architecture — a collection of 10 markdown-defined SKILL.md files orchestrating an AI-assisted SDLC through Cursor's subagent system — the right approach for this team's digital transformation work? Consider the architecture, skill decomposition, handoff protocol, specs-as-knowledge-graph design, and the tradeoffs of encoding process in markdown prompt files vs code.\n\n---\n\n## Step 2: Advisor Responses\n\n### Advisor 1 — Contrarian\n\nSkills as pure markdown give portability and fast iteration, but **zero guarantees**: nothing stops an agent (or a rushed human) from skipping constraints, checkpoints, or handoff fields. Without validation, \"handoff\" becomes **narrative glue**, not a contract—downstream phases inherit ambiguity and silent omissions.\n\n**Where it will fail under real DT load:**\n\n- **Scale and drift**: A markdown-linked `knowledge/specs/` graph is fine for tens of pages; it rots at hundreds—broken links, duplicated truth, specs that disagree with code and with Azure DevOps after partial syncs.\n- **Single sync-to-devops** is clean architecturally but concentrates reconciliation risk (who wins when ADO and repo diverge?).\n- **Governance vs velocity**: \"Checkpoint every stage\" fights throughput unless roles and SLAs are explicit; otherwise you get checkbox approval or bypass (especially Solo).\n- **Stories optional** may be too thin for audit/traceability if regulators or internal QA expect requirement IDs mapped to tests and releases.\n- **TDD as mandate**: Strong for production code; weak for exploration and integration-heavy spikes where the right test is expensive to define first—agents may satisfy the letter with shallow tests.\n\n**What's missing:** Explicit versioning of skills and templates; definition of done per phase that isn't prose-only; automation for link checks, minimal schema on handoffs, and coverage/traceability reports. Operational metrics (handoff quality, rework rate) would show whether the system works or only looks structured.\n\n**Blind spot:** The approach assumes Cursor's subagent behavior stays stable and that everyone follows the same skill paths—enterprise DT usually needs exceptions (spikes, vendor blocks, emergency fixes) with a documented path that doesn't orphan compliance.\n\n**Verdict**: Directionally right for traceability-minded AI-assisted SDLC, but not sufficient without lightweight enforcement, sync conflict rules, and scale controls on the spec graph—otherwise it becomes expensive documentation theater.\n\n---\n\n### Advisor 2 — First Principles\n\nThe fundamental problem is not \"use AI for SDLC.\" It is: **how to ship software repeatedly under enterprise constraints**—auditability, ownership, change control, and evidence—while still gaining speed from AI. You need a shared contract for what \"done\" means at each step and artifacts that survive handoffs between people, tools, and time.\n\nMarkdown-defined skills with handoff templates are a **minimal, versionable process layer**: cheap to edit, readable in PRs, and aligned with \"documentation as code.\" That is a valid simplest shape for governance and narrative traceability, because enforcement in regulated settings often still lives in humans, tickets, and reviews anyway.\n\nWhat to challenge: (1) Ten fixed phases assume work cleaves cleanly; many real tasks are diagonal (fix + test + doc in one pass)—rigidity creates ceremony tax unless Solo path truly absorbs it. (2) Pure markdown means no mechanical guarantees—consistency depends on discipline; drift is the failure mode. (3) Wikilinked specs as the knowledge graph assume curation scales; without conventions and occasional hygiene, links and frontmatter rot. (4) TDD everywhere is a policy, not a law of nature—some discovery or integration-heavy work may need different evidence. (5) Single DevOps sync trades simplicity against latency and blast radius if that step blocks or mis-syncs. (6) Cursor subagents couple process to one product's execution model—acceptable if the team accepts that dependency.\n\n**Bottom line:** For digital transformation with compliance and traceability, a thin, explicit SDLC encoded as skills plus specs is a **sound first-principles fit**: it optimizes for explainable process and artifacts, not automated enforcement. It is not the simplest architecture if the only goal were raw throughput; it is a coherent minimal architecture for governed, repeatable delivery—provided the team treats skills as living policy and invests in keeping specs and handoffs honest.\n\n---\n\n### Advisor 3 — Expansionist\n\nThe hidden upside is that you have treated **governance as a product**: traceability, compliance, and handoffs are not bolted on later but encoded as repeatable rituals (handoff template, specs graph, single DevOps spine). Markdown-only skills are a feature for enterprise work: they are **auditable, diffable, and portable** across models and tools. A reviewer can read a SKILL.md like a control procedure; nothing is buried in opaque code. That aligns digital transformation with how regulated or risk-conscious orgs already think about process.\n\nWhat this unlocks that teams often miss: **compounding organizational memory**. The markdown-linked spec graph plus standardized handoffs turns each project into reusable narrative and decision structure, not just code. Over time you can mine patterns (recurring risks, estimation errors, which checkpoints caught real issues) and tighten skills without rewriting software. The dual Solo/Team workflow is leverage for adoption: skeptics can start light while the same vocabulary scales to full SDLC when stakes rise.\n\nWhere it could go next: **metrics and evidence packs** tied to each skill (what was produced, who approved, links to ADO work items), optional **lightweight validators** (lint the spec graph for broken links, required frontmatter) without abandoning markdown-first design, and **role-specific views** of the same skills (PM vs engineer vs auditor).\n\nThe biggest leverage point is the **single integration point to Azure DevOps** combined with human checkpoints: it is the thread that stitches intent, artifact, and audit trail. Strengthen that spine—clear mapping from spec nodes to work items and back—and everything else (TDD, council, simplify) becomes provable process, not just good habits.\n\n---\n\n### Advisor 4 — Outsider\n\nTen named \"skills\" for a full SDLC sounds systematic until you ask who decides which skill runs next and what happens when work doesn't fit the pipeline (hotfixes, spikes, legacy glue). Without code or enforcement, this is mainly shared prompts and habits—calling it an \"architecture\" can oversell it and leave newcomers expecting automation that isn't there.\n\nThe handoff template plus markdown-linked specs plus Azure DevOps sync risks three parallel truths: local markdown, ADO, and chat history. Unless someone owns deduplication and \"source of truth\" rules, traceability becomes busywork and drift.\n\n\"Knowledge graph\" is often just linked markdown; the heavy term can hide fuzzy ownership of what is canonical and how often it must be updated. Human checkpoints at every stage align with compliance but fight speed; teams may quietly route everything through a \"solo\" lane and only pretend to use the full chain.\n\nMandating TDD in one skill while the rest of the system is soft process can feel arbitrary unless the team already agrees on when tests are non-negotiable. Jargon like \"agent-factory,\" \"council,\" and \"orchestrator\" sounds like a product; a newcomer really sees: long docs, Cursor-specific wiring, and discipline. That can work if leadership treats it as living process docs and trims overlap (e.g. discover vs plan, test vs review)—otherwise it reads as ten folders of ceremony that are easy to admire and hard to sustain.\n\n---\n\n### Advisor 5 — Executor\n\nYes, it can work in practice, but only if you treat it as **process + documentation glue**, not as automation. Markdown skills are cheap to maintain and map cleanly to how Cursor already behaves: they are routing instructions and checklists. The risk is not the format; it is **discipline** (people actually following handoffs, updating specs, and using checkpoints) and **Azure DevOps hygiene** (IDs, fields, and sync cadence).\n\n**Fastest path to value:** Pick one real, small initiative (one epic, one feature), run **discover → plan → implement** end-to-end with **sync-to-devops** only after the spec is stable enough to not thrash work items. Prove traceability: spec markdown link → ADO item → PR → tests. Skip **council** and heavy **design** polish until the loop works once.\n\n**Build first vs later:** First: a thin **solo path** (plan + implement + review + test) with mandatory TDD only where your codebase already supports fast tests. Next: **sync-to-devops** as the single source of truth for \"what we committed to.\" Defer: full 10-skill ceremony, elaborate knowledge-graph grooming, and **simplify** passes until you have code worth simplifying.\n\n**Bottlenecks:** (1) Human checkpoints scale linearly with team size and can become approval queues. (2) No enforcement means drift—skills are ignored under pressure unless leads model them. (3) Spec ↔ ADO sync fails when titles, scope, or parent/child relationships change often. (4) TDD slows teams without test infrastructure or flaky CI.\n\n**Verdict:** Right enough for transformation teams that need narrative and audit trails; wrong if you expect the markdown alone to enforce behavior. Prove one vertical slice fast; expand the skill set only after that slice ships with traceability intact.\n\n---\n\n## Step 3: Peer Reviews\n\n### Peer Reviewer 1\n**Strongest:** E (First Principles) — enterprise framing, conditional verdict, decision-useful.\n**Blind spot:** Incentives and power — nobody ties failures to who is rewarded for maintaining specs vs shipping features.\n**Missed:** Concrete evaluation frame, pilot success metrics, time-boxed review criteria, AI risk in regulated contexts.\n\n### Peer Reviewer 2\n**Strongest:** E (First Principles) — clear thesis, honest limits, decision-oriented bottom line.\n**Blind spot:** How adoption is sustained — incentives, accountability, roles, KPIs, exception workflows.\n**Missed:** Concrete success criteria and feedback loops — what to measure and how often.\n\n### Peer Reviewer 3\n**Strongest:** B (Contrarian) — most falsifiable, concrete failure modes, operational punch list.\n**Blind spot:** Measurement and economics — no tie to outcomes or cost.\n**Missed:** Partial adoption and toolchain reality — DT spans non-Cursor users, legacy systems, fragmented AI tooling.\n\n### Peer Reviewer 4\n**Strongest:** E (First Principles) — clear qualified verdict, real tradeoffs, conditions stated.\n**Blind spot:** Incentives, funding, sustained ownership.\n**Missed:** Outcome evidence and comparators, governed exception paths beyond solo vs team.\n\n### Peer Reviewer 5\n**Strongest:** E (First Principles) — conditional verdict, decision-useful framing.\n**Blind spot:** Outcome and adoption proof — no metrics tied to business outcomes.\n**Missed:** Explicit success criteria, comparison set, security/data governance for AI, total cost of ownership.\n\n---\n\n## Step 4: Chairman Synthesis\n\n### Where the Council Agrees\n\n- Markdown skills are a legitimate, minimal process layer for governed AI-assisted delivery.\n- Handoff + markdown-linked specs give narrative traceability without tooling lock-in.\n- Human checkpoints at phase boundaries are necessary for compliance.\n- This is process glue, not automation — the team must understand it as such.\n- Cursor coupling is a real vendor risk but acceptable at this stage.\n\n### Where the Council Clashes\n\n| Question | Camp A | Camp B |\n|---|---|---|\n| Is \"architecture\" the right word? | Yes — coherent minimal governance structure | No — shared prompts with no enforcement; oversells it |\n| Ship all 10 skills at once? | Yes — compounding value from full loop | No — prove with 3-4 first |\n| TDD mandate | Fine as aspirational policy | Premature where test infra doesn't exist |\n| Spec graph scalability | Biggest long-term asset | Rots without automated link-checking and ownership |\n\nDeepest clash: Compounding organizational memory (upside) vs. compounding ceremony and three parallel truths (downside). Which dominates depends entirely on curation discipline.\n\n### Blind Spots Caught\n\n1. **Incentives & ownership.** No skill assigns a human owner. Under deadline pressure, the path of least resistance is to skip the pipeline.\n2. **Partial adoption.** DT spans people who won't use Cursor, legacy systems, non-agent workflows.\n3. **Cost of the process.** Token spend, senior time curating specs, ceremony overhead — none measured or bounded.\n4. **AI-specific governance.** Data handling, model usage policies, prompt audit trails for regulated contexts.\n5. **Exception paths.** Hotfixes, spikes, and legacy glue don't fit the pipeline.\n\n### The Recommendation\n\n**Yes, adopt it — but scope it honestly and harden it incrementally.**\n\nThe First Principles advisor has the strongest framing: a thin, explicit SDLC encoded as skills + specs is the right shape for governed, repeatable AI-assisted delivery. Call it what it is — structured prompts and conventions, not a mechanically-enforced architecture. Adopt it as living policy with known gaps.\n\nConditions for success:\n1. Start with 4 skills, not 10 (plan, implement, review, test).\n2. Assign a human owner per skill.\n3. Document a fast-path (hotfix/spike) with lighter ceremony but equivalent audit trail.\n4. Lint the spec graph — broken links and missing frontmatter should fail CI.\n5. Measure from week one: lead time (plan → merged PR) and spec-to-ADO sync accuracy.\n\n### The One Thing to Do First\n\nRun one real feature end-to-end through plan → implement → review → test → sync-to-devops, then measure what broke. Not a hello-world. A real, small, scoped feature with a real ADO work item. Document every friction point vs. every real issue caught. That evidence earns team buy-in and tells you which of the remaining 6 skills to activate next.\n"}, "types": ["Decision", "Process", "Product", "Reference", "Strategy"], "bundles": ["ai-first-dis"]};
const bodyEl = document.body;
const graphEl = document.getElementById("graph");
const canvasEl = document.getElementById("canvas");
const detailEl = document.getElementById("detail");
const resizerEl = document.getElementById("resizer");
const detailToggleEl = document.getElementById("detailToggle");
const typeEl = document.getElementById("type");
const bundleEl = document.getElementById("bundle");
const searchEl = document.getElementById("search");
const zoomInEl = document.getElementById("zoomIn");
const zoomOutEl = document.getElementById("zoomOut");
const zoomResetEl = document.getElementById("zoomReset");
document.getElementById("stats").textContent = `${graph.nodes.length} concepts, ${graph.edges.length} links`;
for (const type of graph.types) typeEl.append(new Option(type, type));
for (const bundle of graph.bundles) bundleEl.append(new Option(bundle, bundle));

const CANVAS_W = 6000, CANVAS_H = 4500;
const CENTER_X = CANVAS_W / 2, CENTER_Y = CANVAS_H / 2;
canvasEl.style.width = `${CANVAS_W}px`;
canvasEl.style.height = `${CANVAS_H}px`;
const svg = document.getElementById("edges");
svg.setAttribute("width", CANVAS_W);
svg.setAttribute("height", CANVAS_H);

const SETTINGS = {
  charge: 9000, chargeCap: 60, linkDistance: 110, linkStrength: 0.04, gravity: 0.012,
  friction: 0.85, collidePad: 16, collideIterations: 2, alphaMin: 0.02, alphaDecay: 0.99, reheat: 0.7,
};

const sim = { nodes: [], links: [], byId: new Map(), alpha: 0 };
let hubDegree = Infinity;
let viewScale = 1, viewX = 0, viewY = 0;
let userInteracted = false;
let running = false;

// ---------- view transform (pan / zoom) ----------
function applyTransform() {
  canvasEl.style.transform = `translate(${viewX}px, ${viewY}px) scale(${viewScale})`;
  updateLabelLOD();
}
function clampScale(value) { return Math.min(6, Math.max(0.05, value)); }

function contentBounds() {
  if (!sim.nodes.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const node of sim.nodes) {
    const pad = node.r + 30;
    minX = Math.min(minX, node.x - pad); minY = Math.min(minY, node.y - pad);
    maxX = Math.max(maxX, node.x + pad); maxY = Math.max(maxY, node.y + pad);
  }
  return { minX, minY, width: maxX - minX, height: maxY - minY };
}

function fitView() {
  const bounds = contentBounds();
  const cw = graphEl.clientWidth, ch = graphEl.clientHeight;
  if (!bounds || !cw || !ch) return;
  viewScale = clampScale(Math.min(cw / bounds.width, ch / bounds.height, 1.5));
  viewX = (cw - bounds.width * viewScale) / 2 - bounds.minX * viewScale;
  viewY = (ch - bounds.height * viewScale) / 2 - bounds.minY * viewScale;
  applyTransform();
}

function zoomAt(clientX, clientY, factor) {
  userInteracted = true;
  const rect = graphEl.getBoundingClientRect();
  const mx = clientX - rect.left, my = clientY - rect.top;
  const px = (mx - viewX) / viewScale, py = (my - viewY) / viewScale;
  viewScale = clampScale(viewScale * factor);
  viewX = mx - px * viewScale;
  viewY = my - py * viewScale;
  applyTransform();
}

graphEl.addEventListener("wheel", event => {
  event.preventDefault();
  zoomAt(event.clientX, event.clientY, event.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

let panning = false, panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
graphEl.addEventListener("pointerdown", event => {
  if (event.target.closest(".node") || event.target.closest("#zoomControls")) return;
  panning = true; userInteracted = true;
  panStartX = event.clientX; panStartY = event.clientY;
  panOriginX = viewX; panOriginY = viewY;
  graphEl.classList.add("panning");
  graphEl.setPointerCapture(event.pointerId);
});
graphEl.addEventListener("pointermove", event => {
  if (!panning) return;
  viewX = panOriginX + (event.clientX - panStartX);
  viewY = panOriginY + (event.clientY - panStartY);
  applyTransform();
});
function endPan(event) {
  if (!panning) return;
  panning = false;
  graphEl.classList.remove("panning");
  try { graphEl.releasePointerCapture(event.pointerId); } catch (err) {}
}
graphEl.addEventListener("pointerup", endPan);
graphEl.addEventListener("pointercancel", endPan);

function zoomFromCenter(factor) {
  const rect = graphEl.getBoundingClientRect();
  zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, factor);
}
zoomInEl.addEventListener("click", () => zoomFromCenter(1.25));
zoomOutEl.addEventListener("click", () => zoomFromCenter(1 / 1.25));
zoomResetEl.addEventListener("click", () => { userInteracted = false; fitView(); });

// ---------- level-of-detail labels (constant screen size, fade by zoom) ----------
function updateLabelLOD() {
  for (const node of sim.nodes) {
    const label = node.labelEl;
    if (!label) continue;
    const radiusOnScreen = node.r * viewScale;
    const show = radiusOnScreen > 14 || node.degree >= hubDegree;
    if (show) {
      label.style.display = "block";
      label.style.transform = `translateX(-50%) scale(${1 / viewScale})`;
    } else {
      label.style.display = "none";
    }
  }
}

// ---------- detail panel chrome ----------
function setDetailCollapsed(collapsed) {
  bodyEl.classList.toggle("detail-collapsed", collapsed);
  detailToggleEl.textContent = collapsed ? "Show details" : "Hide details";
  detailToggleEl.setAttribute("aria-expanded", String(!collapsed));
  requestAnimationFrame(() => { if (!userInteracted) fitView(); });
}
function setDetailWidth(width) {
  const maxWidth = Math.max(300, Math.floor(window.innerWidth * 0.75));
  const next = Math.min(Math.max(width, 260), maxWidth);
  document.documentElement.style.setProperty("--detail-width", `${next}px`);
  requestAnimationFrame(() => { if (!userInteracted) fitView(); });
}
detailToggleEl.addEventListener("click", () => setDetailCollapsed(!bodyEl.classList.contains("detail-collapsed")));
window.addEventListener("resize", () => requestAnimationFrame(() => { if (!userInteracted) fitView(); }));
resizerEl.addEventListener("pointerdown", event => {
  event.preventDefault();
  resizerEl.classList.add("dragging");
  resizerEl.setPointerCapture(event.pointerId);
  const onMove = moveEvent => setDetailWidth(window.innerWidth - moveEvent.clientX);
  const onUp = upEvent => {
    resizerEl.classList.remove("dragging");
    resizerEl.releasePointerCapture(upEvent.pointerId);
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
});

// ---------- force simulation ----------
function simulateOnce() {
  const nodes = sim.nodes, alpha = sim.alpha, cfg = SETTINGS;
  for (const node of nodes) { node.fx = 0; node.fy = 0; }
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let dist2 = dx * dx + dy * dy;
      if (dist2 < 1e-4) { dx = (Math.random() - 0.5) * 0.5; dy = (Math.random() - 0.5) * 0.5; dist2 = dx * dx + dy * dy + 1e-4; }
      const dist = Math.sqrt(dist2);
      const ux = dx / dist, uy = dy / dist;
      const rep = Math.min(cfg.charge / dist2, cfg.chargeCap);
      a.fx += ux * rep; a.fy += uy * rep;
      b.fx -= ux * rep; b.fy -= uy * rep;
    }
  }
  for (const link of sim.links) {
    const a = link.source, b = link.target;
    let dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const force = (dist - cfg.linkDistance) * cfg.linkStrength;
    const ux = dx / dist, uy = dy / dist;
    a.fx += ux * force; a.fy += uy * force;
    b.fx -= ux * force; b.fy -= uy * force;
  }
  for (const node of nodes) {
    if (node.pinned) { node.vx = 0; node.vy = 0; continue; }
    node.fx += (CENTER_X - node.x) * cfg.gravity;
    node.fy += (CENTER_Y - node.y) * cfg.gravity;
    node.vx = (node.vx + node.fx * alpha) * cfg.friction;
    node.vy = (node.vy + node.fy * alpha) * cfg.friction;
    node.x += node.vx;
    node.y += node.vy;
  }
  resolveCollisions();
}

function resolveCollisions() {
  const nodes = sim.nodes, cfg = SETTINGS;
  for (let iteration = 0; iteration < cfg.collideIterations; iteration++) {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let dist2 = dx * dx + dy * dy;
        const minDist = a.r + b.r + cfg.collidePad;
        if (dist2 >= minDist * minDist) continue;
        if (dist2 < 1e-4) { dx = (Math.random() - 0.5) * 0.5; dy = (Math.random() - 0.5) * 0.5; dist2 = dx * dx + dy * dy + 1e-4; }
        const dist = Math.sqrt(dist2);
        const ux = dx / dist, uy = dy / dist;
        const push = (minDist - dist) * 0.5;
        if (!a.pinned) { a.x += ux * push; a.y += uy * push; }
        if (!b.pinned) { b.x -= ux * push; b.y -= uy * push; }
      }
    }
  }
}

function updatePositions() {
  for (const node of sim.nodes) {
    node.el.style.left = `${node.x - node.r}px`;
    node.el.style.top = `${node.y - node.r}px`;
  }
  for (const link of sim.links) {
    link.el.setAttribute("x1", link.source.x);
    link.el.setAttribute("y1", link.source.y);
    link.el.setAttribute("x2", link.target.x);
    link.el.setAttribute("y2", link.target.y);
  }
  updateLabelLOD();
}

function step() {
  if (sim.alpha > SETTINGS.alphaMin) {
    simulateOnce();
    sim.alpha *= SETTINGS.alphaDecay;
  } else {
    sim.alpha = 0;
  }
  updatePositions();
  if (!userInteracted) fitView();
  if (sim.alpha > 0 || dragging) {
    requestAnimationFrame(step);
  } else {
    running = false;
  }
}

function reheat(value) {
  sim.alpha = Math.max(sim.alpha, value);
  if (!running) { running = true; requestAnimationFrame(step); }
}

// ---------- node interactions (click to inspect, drag to reposition) ----------
let dragging = false;
function attachNodeInteractions(el, node) {
  let down = false, moved = false, startX = 0, startY = 0;
  el.addEventListener("pointerdown", event => {
    event.stopPropagation();
    down = true; moved = false;
    startX = event.clientX; startY = event.clientY;
    el.setPointerCapture(event.pointerId);
  });
  el.addEventListener("pointermove", event => {
    if (!down) return;
    if (!moved && Math.abs(event.clientX - startX) + Math.abs(event.clientY - startY) > 4) {
      moved = true; dragging = true; userInteracted = true;
      node.pinned = true; el.classList.add("dragging");
    }
    if (!moved) return;
    const rect = graphEl.getBoundingClientRect();
    node.x = (event.clientX - rect.left - viewX) / viewScale;
    node.y = (event.clientY - rect.top - viewY) / viewScale;
    node.vx = 0; node.vy = 0;
    reheat(0.3);
  });
  el.addEventListener("pointerup", event => {
    if (!down) return;
    down = false;
    try { el.releasePointerCapture(event.pointerId); } catch (err) {}
    if (moved) {
      dragging = false; node.pinned = false; el.classList.remove("dragging");
      reheat(0.15);
    } else {
      show(node.data);
    }
  });
}

// ---------- build / rebuild the scene from current filters ----------
function buildScene() {
  const q = searchEl.value.trim().toLowerCase();
  const type = typeEl.value;
  const bundle = bundleEl.value;
  const visible = graph.nodes.filter(node => {
    const hay = `${node.id} ${node.label} ${node.type} ${node.bundle} ${node.tags.join(" ")}`.toLowerCase();
    return (!q || hay.includes(q)) && (!type || node.type === type) && (!bundle || node.bundle === bundle);
  });
  const ids = new Set(visible.map(node => node.id));
  const links = graph.edges.filter(edge => ids.has(edge.source) && ids.has(edge.target));

  const degree = new Map(visible.map(node => [node.id, 0]));
  for (const edge of links) {
    degree.set(edge.source, degree.get(edge.source) + 1);
    degree.set(edge.target, degree.get(edge.target) + 1);
  }
  const sortedDegrees = [...degree.values()].sort((a, b) => b - a);
  hubDegree = sortedDegrees.length ? Math.max(2, sortedDegrees[Math.floor(sortedDegrees.length * 0.15)]) : Infinity;

  const previous = sim.byId;
  const simNodes = visible.map(node => {
    const old = previous.get(node.id);
    return {
      id: node.id, data: node, r: node.size / 2 + 13, degree: degree.get(node.id) || 0,
      x: old ? old.x : CENTER_X + (Math.random() - 0.5) * 700,
      y: old ? old.y : CENTER_Y + (Math.random() - 0.5) * 700,
      vx: 0, vy: 0, pinned: false,
    };
  });
  const byId = new Map(simNodes.map(node => [node.id, node]));
  const simLinks = links.map(edge => ({ source: byId.get(edge.source), target: byId.get(edge.target) }));

  sim.nodes = simNodes;
  sim.links = simLinks;
  sim.byId = byId;

  svg.innerHTML = "";
  for (const link of sim.links) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("stroke", "#cbd5e1");
    line.setAttribute("stroke-width", "1.2");
    svg.append(line);
    link.el = line;
  }
  canvasEl.querySelectorAll(".node").forEach(el => el.remove());
  for (const node of sim.nodes) {
    const el = document.createElement("button");
    el.className = "node";
    const diameter = node.r * 2;
    el.style.width = `${diameter}px`;
    el.style.height = `${diameter}px`;
    el.style.background = node.data.color;
    el.title = node.id;
    const span = document.createElement("span");
    span.textContent = node.data.label;
    el.append(span);
    attachNodeInteractions(el, node);
    canvasEl.append(el);
    node.el = el;
    node.labelEl = span;
  }

  reheat(1);
}

function show(node) {
  const incoming = graph.edges.filter(edge => edge.target === node.id).map(edge => edge.source);
  const outgoing = graph.edges.filter(edge => edge.source === node.id).map(edge => edge.target);
  detailEl.innerHTML = `
    <div class="chip">${node.type}</div><div class="chip">${node.bundle || "bundle"}</div>
    <h1>${node.label}</h1>
    <p class="muted">${node.id}</p>
    <p>${node.description || ""}</p>
    <h2>Links</h2>
    <p><strong>Out:</strong> ${outgoing.join(", ") || "none"}</p>
    <p><strong>In:</strong> ${incoming.join(", ") || "none"}</p>
    <h2>Body</h2>
    <pre>${graph.bodies[node.id] || ""}</pre>
  `;
}

searchEl.addEventListener("input", buildScene);
typeEl.addEventListener("change", buildScene);
bundleEl.addEventListener("change", buildScene);
buildScene();
</script>
